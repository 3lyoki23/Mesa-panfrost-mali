name: Build Mesa
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar
        run: git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git .
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get build-dep -y mesa
          sudo apt-get install -y python3-pip
          pip3 install meson==1.4.0
      - name: Compilar
        run: |
          meson setup build -Dgallium-drivers=panfrost -Dvulkan-drivers=panfrost -Dbuildtype=release
          ninja -C build
      - name: Guardar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salida-mesa
          path: build/
          
